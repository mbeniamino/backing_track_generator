[project]
name = "backing-track-generator"
version = "0.1.0"
description = "Split a song into tracks, then mute, loop, transpose and render backing tracks"
authors = [
    { name = "Matteo Beniamino", email = "beniamino@beniamino.eu" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "beat-this>=1.1.0",
    "demucs>=4.0.1",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.5",
    "pyside6>=6.12.0",
    "pyyaml>=6.0.4",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
]

[project.scripts]
backing-track-generator = "backing_track_generator:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
